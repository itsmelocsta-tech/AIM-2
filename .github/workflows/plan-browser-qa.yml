name: Plain Language Browser QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plan-qa-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  plan-wording:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - run: bun install --frozen-lockfile
      - run: npm ci --prefix qa
      - run: npx playwright install --with-deps chromium
        working-directory: qa
      - run: npx playwright test --config plan.config.mjs
        working-directory: qa
      - name: Scope of proof
        if: always()
        run: |
          echo "QA runner: Playwright; tested head: ${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production starting-plan screen with fictional saved results, phone and desktop. Checks restored legacy labels, plan choice, save confirmation, reload and viewport bounds. Does not establish live Gemini writing quality or Firebase persistence." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playwright-plan-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            qa/playwright-report/plan/
            qa/test-results/
          retention-days: 14
