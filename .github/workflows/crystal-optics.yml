name: Crystal Optics Verification

on:
  push:
    branches: [feat/fractal-atmosphere-foundation, feat/fractal-crystal-layer-order]
    paths: ['fractal_crystal_engine/**', '.github/workflows/crystal-optics.yml']
  pull_request:
    paths: ['fractal_crystal_engine/**', '.github/workflows/crystal-optics.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r fractal_crystal_engine/requirements.txt
      - run: python fractal_crystal_engine/crystal_optics_engine.py
      - run: python -m pytest -q fractal_crystal_engine/tests
