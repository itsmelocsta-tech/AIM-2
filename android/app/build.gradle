import groovy.json.JsonSlurper
plugins { id 'com.android.application' }
def offer = new JsonSlurper().parse(file('../../play-launch-offer.json'))
def host = providers.environmentVariable('AIM_ANDROID_URL').getOrElse('https://aim-2-git-codex-android-play-packaging-itsmelocsta-5904.vercel.app')
if (!(host ==~ /https:\/\/[A-Za-z0-9.-]+\/?/)) throw new GradleException('AIM_ANDROID_URL must be an HTTPS origin without a path')
def signingReady = ['AIM_KEYSTORE_PATH','AIM_KEYSTORE_PASSWORD','AIM_KEY_ALIAS','AIM_KEY_PASSWORD'].every { System.getenv(it) }
android {
    namespace 'com.itsmelocsta.aim'
    compileSdk 36
    defaultConfig {
        applicationId 'com.itsmelocsta.aim'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        buildConfigField 'String', 'APP_ORIGIN', '"' + host.replaceAll('/$', '') + '"'
        buildConfigField 'String', 'PRODUCT_ID', '"' + offer.subscriptionProductId + '"'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(System.getenv('AIM_KEYSTORE_PATH'))
                storePassword System.getenv('AIM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AIM_KEY_ALIAS')
                keyPassword System.getenv('AIM_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { if (signingReady) signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.configureEach { task ->
    if (task.name == 'bundleRelease') task.doFirst {
        if (!signingReady) throw new GradleException('Release signing secrets are missing; refusing to publish an unsigned release')
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.android.billingclient:billing:8.3.0'
}
